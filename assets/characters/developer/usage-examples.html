<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./himma-assets.css">
  <title>مثال استخدام أصول هِمّة</title>
</head>
<body>
  <!-- الشخصية: WebP أساسي وPNG بديل -->
  <picture>
    <source srcset="../assets/characters/girl/webp/hem-chr-g-03-encourage-512.webp" type="image/webp">
    <img class="himma-character"
         src="../assets/characters/girl/png/hem-chr-g-03-encourage-512.png"
         width="512" height="512"
         alt="شخصية هِمّة تشجع الطالب">
  </picture>

  <!-- الشارة: SVG هو الخيار الأساسي -->
  <img class="himma-reward"
       src="../assets/rewards/svg/hem-bdg-05-word-hero.svg"
       alt="شارة بطل الكلمات">

  <!-- أيقونة مرافقة لنص: زخرفية فقط -->
  <button class="himma-icon-button" type="button">
    <img class="himma-icon" src="../assets/icons/ui/svg/play-audio.svg" alt="" aria-hidden="true">
    <span>تشغيل الصوت</span>
  </button>

  <!-- التالي في الواجهة العربية يستخدم السهم المتجه لليسار -->
  <img class="himma-icon" src="../assets/icons/ui/svg/next-rtl.svg" alt="">
</body>
</html>
