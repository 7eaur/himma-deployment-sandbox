name: Himma Deployment Sandbox Gate

permissions:
  contents: read

on:
  push:
    branches: ['deployment/**']
  pull_request:
    branches: ['deployment/**']

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: himma_test
          POSTGRES_PASSWORD: himma_test_pass
          POSTGRES_DB: himma_test_db
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U himma_test -d himma_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql://himma_test:himma_test_pass@localhost:5432/himma_test_db
      HIMMA_TEST_DATABASE_URL: postgresql://himma_test:himma_test_pass@localhost:5432/himma_test_db
      API_SECRET_KEY: ci-test-secret-32-chars-minimum!!
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-minio-access-key
      S3_SECRET_KEY: ci-minio-secret-key
      S3_BUCKET_NAME: himma-audio-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python ../../packages/content/scripts/validate_catalog.py
      - run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: alembic check
      - run: pytest -v --tb=short

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build

  integration:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: himma_test
          POSTGRES_PASSWORD: himma_test_pass
          POSTGRES_DB: himma_test_db
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U himma_test -d himma_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://himma_test:himma_test_pass@localhost:5432/himma_test_db
      API_SECRET_KEY: ci-test-secret-32-chars-minimum!!
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-minio-access-key
      S3_SECRET_KEY: ci-minio-secret-key
      S3_BUCKET_NAME: himma-audio-test
      NEXT_PUBLIC_API_URL: http://localhost:8000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-only-researcher-password
      E2E_RESEARCHER_USERNAME: admin
      E2E_RESEARCHER_PASSWORD: ci-only-researcher-password
      SEED_DEMO_STUDENTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        working-directory: services/api
        run: pip install -r requirements.txt
      - name: Start pinned MinIO
        run: |
          curl -fsSLo /tmp/minio https://dl.min.io/server/minio/release/linux-amd64/archive/minio.RELEASE.2025-09-07T16-13-09Z
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  /tmp/minio" | sha256sum --check -
          chmod +x /tmp/minio
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=ci-minio-access-key MINIO_ROOT_PASSWORD=ci-minio-secret-key nohup /tmp/minio server /tmp/minio-data --address :9000 >/tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
          curl -sf http://localhost:9000/minio/health/live
      - name: Initialize object bucket
        working-directory: services/api
        run: |
          python - <<'EOF'
          import boto3
          from botocore.exceptions import ClientError
          s3=boto3.client('s3',endpoint_url='http://localhost:9000',aws_access_key_id='ci-minio-access-key',aws_secret_access_key='ci-minio-secret-key',region_name='us-east-1')
          try: s3.head_bucket(Bucket='himma-audio-test')
          except ClientError: s3.create_bucket(Bucket='himma-audio-test')
          EOF
      - name: Migrate and seed
        working-directory: services/api
        run: |
          alembic upgrade head
          python seed_all.py
          python -m db.seed
      - name: Start FastAPI
        working-directory: services/api
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/ready && break; sleep 2; done
          curl -sf http://localhost:8000/ready
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start Next.js
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          npm start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break; sleep 2; done
          curl -sf http://localhost:3000
      - name: Playwright
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/vertical-slice.spec.ts tests/e2e/accessibility-integration.spec.ts tests/e2e/media-fidelity.spec.ts tests/e2e/question-experience.spec.ts --reporter=list
