name: Import Himma Sandbox Snapshot

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  import-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone pinned sandbox source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch deployment/platform-sandbox https://github.com/7eaur/himma-.git /tmp/himma-source
          cd /tmp/himma-source
          test "$(git rev-parse HEAD)" = "4468575465d8108bc2fb5c15d3d8faccb4c7a370"

      - name: Replace target with sandbox snapshot
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' --exclude='.github/workflows' /tmp/himma-source/ ./

      - name: Commit imported snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Himma Sandbox Import"
          git config user.email "himma-sandbox-import@users.noreply.github.com"
          git add -A
          git commit -m "chore: import sandbox snapshot 4468575"
          git push origin HEAD:main
