name: Himma CI — Quality Gate

permissions:
  contents: read

on:
  push:
    branches: [main, 'stage/*', 'recovery/*', 'b*/*']
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit frontend dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Scan current tree for committed secrets
        shell: bash
        run: |
          set -uo pipefail
          curl -fsSLo /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          status=0
          /tmp/gitleaks dir --redact --no-banner --exit-code 1 --report-format json --report-path /tmp/gitleaks-report.json . || status=$?
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/gitleaks-report.json')
          findings = json.loads(path.read_text(encoding='utf-8')) if path.exists() else []
          print(f'gitleaks findings: {len(findings)}')
          for row in findings:
              print(f"{row.get('RuleID', 'unknown')}: {row.get('File', '?')}:{row.get('StartLine', '?')}")
          PY
          exit "$status"
      - name: Guard production paths from unfinished placeholders
        shell: bash
        run: |
          set -euo pipefail
          production_paths=(apps/web/src services/api packages/content/scripts)
          grep_excludes=(
            --exclude='test_*.py'
            --exclude='*.test.ts'
            --exclude='*.test.tsx'
            --exclude='*.spec.ts'
            --exclude='*.spec.tsx'
            --exclude-dir='tests'
            --exclude-dir='__tests__'
          )
          if grep -RInE '(TODO|FIXME)' "${production_paths[@]}" \
            --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
            "${grep_excludes[@]}"; then
            echo 'Unresolved TODO/FIXME marker found in production paths.' >&2
            exit 1
          fi
          if grep -RInEi '(^|[^[:alnum:]_])(mock|demo)([^[:alnum:]_]|$)' "${production_paths[@]}" \
            --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
            "${grep_excludes[@]}"; then
            echo 'Mock/demo marker found in production paths.' >&2
            exit 1
          fi
          if grep -RInE 'time\.sleep\([[:space:]]*[0-9]+([.][0-9]+)?[[:space:]]*\)|await[[:space:]]+new[[:space:]]+Promise\([^\n]*setTimeout' "${production_paths[@]}" \
            --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
            "${grep_excludes[@]}"; then
            echo 'Possible hard-coded fake delay found in production paths.' >&2
            exit 1
          fi
      - name: Guard disabled or skipped tests
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'pytest\.skip|pytest\.mark\.skip|@unittest\.skip|(^|[^[:alnum:]_])(test|describe)\.skip\(' services/api apps/web/src apps/web/tests \
            --include='*.py' --include='*.ts' --include='*.tsx'; then
            echo 'Disabled/skipped test found; document and remove the skip before closing the stage.' >&2
            exit 1
          fi

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: himma_test
          POSTGRES_PASSWORD: himma_test_pass
          POSTGRES_DB: himma_test_db
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U himma_test -d himma_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql://himma_test:himma_test_pass@localhost:5432/himma_test_db
      API_SECRET_KEY: ci-test-secret-32-chars-minimum!!
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-minio-access-key
      S3_SECRET_KEY: ci-minio-secret-key
      S3_BUCKET_NAME: himma-audio-test
      HIMMA_TEST_DATABASE_URL: postgresql://himma_test:himma_test_pass@localhost:5432/himma_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Validate approved content catalog
        run: python ../../packages/content/scripts/validate_catalog.py
      - name: Alembic migrations — upgrade, downgrade, upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Alembic model drift check
        run: alembic check
      - name: Verify seed idempotency (run twice)
        run: |
          python seed.py
          python seed.py
          python -c "
          import os
          from sqlalchemy import create_engine, text
          e = create_engine(os.environ['DATABASE_URL'])
          with e.connect() as c:
              n = c.execute(text('SELECT COUNT(*) FROM content_items')).scalar()
              assert n > 0, f'Expected content_items > 0, got {n}'
              print(f'content_items count: {n} (idempotent seed OK)')
          "
      - name: Run backend tests
        run: pytest -v --tb=short

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Frontend unit tests
        run: npm test -- --ci
      - name: Build Next.js
        run: npm run build

  integration:
    runs-on: ubuntu-24.04
    needs: [security, backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: himma_test
          POSTGRES_PASSWORD: himma_test_pass
          POSTGRES_DB: himma_test_db
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U himma_test -d himma_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://himma_test:himma_test_pass@localhost:5432/himma_test_db
      API_SECRET_KEY: ci-test-secret-32-chars-minimum!!
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-minio-access-key
      S3_SECRET_KEY: ci-minio-secret-key
      S3_BUCKET_NAME: himma-audio-test
      REDIS_URL: redis://localhost:6379/0
      NEXT_PUBLIC_API_URL: http://localhost:8000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-only-researcher-password
      E2E_RESEARCHER_USERNAME: admin
      E2E_RESEARCHER_PASSWORD: ci-only-researcher-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        working-directory: services/api
        run: pip install -r requirements.txt
      - name: Start pinned MinIO server
        env:
          MINIO_ROOT_USER: ci-minio-access-key
          MINIO_ROOT_PASSWORD: ci-minio-secret-key
        run: |
          curl -fsSLo /tmp/minio \
            https://dl.min.io/server/minio/release/linux-amd64/archive/minio.RELEASE.2025-09-07T16-13-09Z
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  /tmp/minio" | sha256sum --check -
          chmod +x /tmp/minio
          mkdir -p /tmp/minio-data
          nohup /tmp/minio server /tmp/minio-data --address :9000 >/tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
          curl -sf http://localhost:9000/minio/health/live || (cat /tmp/minio.log && exit 1)
      - name: Init MinIO bucket
        working-directory: services/api
        run: |
          pip install boto3
          python - <<'EOF'
          import boto3, time, sys
          from botocore.exceptions import ClientError
          s3 = boto3.client('s3', endpoint_url='http://localhost:9000', aws_access_key_id='ci-minio-access-key', aws_secret_access_key='ci-minio-secret-key', region_name='us-east-1')
          for i in range(30):
              try:
                  s3.list_buckets()
                  try: s3.head_bucket(Bucket='himma-audio-test')
                  except ClientError: s3.create_bucket(Bucket='himma-audio-test')
                  print('MinIO ready'); sys.exit(0)
              except Exception:
                  time.sleep(2)
          sys.exit(1)
          EOF
      - name: Run migrations and seed full runtime catalog
        working-directory: services/api
        run: |
          alembic upgrade head
          python seed_all.py
          python -m db.seed
      - name: Start FastAPI in background
        working-directory: services/api
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl -sf http://localhost:8000/health || exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend deps
        working-directory: apps/web
        run: npm ci
      - name: Build Next.js
        working-directory: apps/web
        run: npm run build
      - name: Start Next.js in background
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break; sleep 2; done
          curl -sf http://localhost:3000 || exit 1
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true
        run: >-
          npx playwright test
          tests/e2e/vertical-slice.spec.ts
          tests/e2e/accessibility-integration.spec.ts
          tests/e2e/media-fidelity.spec.ts
          tests/e2e/question-experience.spec.ts
          tests/e2e/admin-responsive.spec.ts
          --reporter=list
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
